services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["--migrate"]
    environment: &api_environment
      ConnectionStrings__Default: Host=db;Database=helpdesk;Username=helpdesk;Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Configure JWT_KEY}
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *api_environment
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:

